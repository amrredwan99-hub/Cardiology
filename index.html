<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14283d"><link rel="manifest" href="manifest.json"><title>Cardiology Mastery</title><style>body{font:16px system-ui;margin:auto;max-width:800px;padding:20px;background:#f2f5f8;color:#14283d}body.dark{background:#101827;color:#e6edf5}section{background:#ffffff12;border:1px solid #8295a766;border-radius:14px;padding:18px;margin:12px 0}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #8295a7;border-radius:8px;margin:4px;background:transparent;color:inherit}button{cursor:pointer}button:hover{background:#8295a733}label{display:block;padding:12px;border:1px solid #8295a766;border-radius:8px;margin:8px 0}a{color:#398ad0}textarea{width:90%}small{opacity:.8}h1{margin-bottom:0}progress{width:100%}body{max-width:900px;background:#eef4f8;color:#183047}body.dark{background:#101827;color:#e6edf5}section{background:#fff;border:1px solid #cbd9e5;box-shadow:0 5px 20px #1830470b}body.dark section{background:#192538;border-color:#41536a}h1{color:#0d9488}button{font-weight:600}button.primary{background:#2563eb;color:white;border-color:#2563eb;width:100%;margin:8px 0}button.nav{background:#0f766e;color:white;border:0}button:disabled{opacity:.4;cursor:default}label{cursor:pointer}label:has(input:checked){border-color:#2563eb;background:#2563eb15}label.good{border:2px solid #16a34a;background:#16a34a20}label.bad{border:2px solid #dc2626;background:#dc262620}.navrow,.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}.star{color:#b77908;font-size:22px}.source{border-inline-start:4px solid #2563eb;padding:12px;background:#2563eb10;border-radius:8px}.arabic{direction:rtl;text-align:right;line-height:1.9}.memory{border-inline-start:4px solid #8b5cf6;padding:12px;background:#8b5cf610}.goodtext{color:#16803c}.badtext{color:#dc2626}body.dark .goodtext{color:#86efac}body.dark .badtext{color:#fca5a .brand{position:relative;overflow:hidden;background:linear-gradient(120deg,#102a43,#12566a 65%,#0f766e);color:#fff;padding:26px 24px;border-radius:18px;box-shadow:0 8px 24px #102a4326;margin-bottom:18px}.brand:after{content:'';position:absolute;right:-40px;top:-70px;width:220px;height:220px;border:1px solid #ffffff24;border-radius:50%;box-shadow:0 0 0 25px #ffffff0b,0 0 0 50px #ffffff08;pointer-events:none}.brand h1{font-family:system-ui,sans-serif;font-size:clamp(25px,5vw,38px);letter-spacing:-1.1px;line-height:1.15;color:white;margin:8px 0}.brand .byline{color:#a7f3d0;font-weight:600;margin:6px 0 12px}.brand small{color:#e0f2fe;opacity:1}.brand .eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:#bae6fd}.feedback-card{border:1px solid #cbd9e5;border-radius:12px;overflow:hidden;margin:16px 0;background:#fff}.feedback-heading{margin:0;padding:12px 15px;font-size:16px;font-weight:750;display:flex;align-items:center;gap:8px;line-height:1.4}.feedback-body{padding:4px 15px 12px;line-height:1.7;overflow-wrap:anywhere}.guideline .feedback-heading{background:#e8f0ff;color:#1e40af}.explanation .feedback-heading{background:#e1f4ef;color:#115e59}.recall .feedback-heading{background:#f0eaff;color:#6332a0}.feedback-body .arabic{border-top:1px solid #cbd9e5;padding-top:12px}.language-label{display:block;font-size:11px;letter-spacing:1px;font-weight:700;color:#52677b;margin-top:12px}.feedback-card summary{list-style:none}.feedback-card summary:after{content:'+';margin-left:auto}.feedback-card[open] summary:after{content:'−'}.feedback-card summary::-webkit-details-marker{display:none}body.dark .feedback-card{background:#192538;border-color:#41536a}body.dark .guideline .feedback-heading{background:#233b63;color:#bfdbfe}body.dark .explanation .feedback-heading{background:#194842;color:#a7f3d0}body.dark .recall .feedback-heading{background:#40335c;color:#ddd6fe}body.dark .language-label{color:#b6c8da}body.dark .feedback-body .arabic{border-color:#41536a}@media(max-width: .explanation-divider{border:0;border-top:1px solid currentColor;opacity:.15;margin:14px 0}</style><header class="brand"><div class="eyebrow">♥ &nbsp; GUIDELINE-BASED LEARNING</div><h1>Cardiology Mastery</h1><p class="byline">By Dr. Amr Redwan</p><small>ESC/ERS 2022 · Pulmonary Hypertension · v0.2.2</small></header><section id="dash"></section><button onclick="document.body.classList.toggle('dark');s.dark=document.body.classList.contains('dark');save()">Light / Dark</button><button onclick="start('all')">Study</button><button onclick="start('wrong')">Mistakes</button><button onclick="start('due')">Due review</button><button onclick="start('book')">Bookmarks</button><button onclick="exam()">Exam</button><section id="main"></section><button onclick="backup()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button><input hidden id="imp" type="file" accept="application/json"><button onclick="if(confirm('Reset all progress and notes?')){s={a:{},dark:s.dark};save();start('all')}">Reset pilot</button><footer>Cardiology Mastery · By Dr. Amr Redwan</footer><script src="questions.js"></script><script>
const excerpts=["mPAP >20 mmHg", "Pre-capillary PH: mPAP >20 mmHg; PAWP ≤15 mmHg; PVR >2 WU", "IpcPH: mPAP >20 mmHg; PAWP >15 mmHg; PVR ≤2 WU", "CpcPH: mPAP >20 mmHg; PAWP >15 mmHg; PVR >2 WU", "This haemodynamic condition may be described by the term ‘unclassified PH’.", "mPAP/CO slope >3 mmHg/L/min between rest and exercise", "4.1 Chronic thrombo-embolic PH", "1.4.1 Connective tissue disease", "3.1 Obstructive lung disease or emphysema", "2.1.1 with preserved ejection fraction", "5.4 Chronic renal failure with or without haemodialysis", "1.5 PAH with features of venous/capillary (PVOD/PCH) involvement"];let s={a:{},dark:false};try{s=JSON.parse(localStorage.getItem('ph-pilot'))||s}catch{};let ids=[],i=0,mode='all',end=0,timer,answers={};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('ph-pilot',JSON.stringify(s))}catch{alert('Storage unavailable; export a backup.')}dash()}function dash(){let a=Object.values(s.a),n=a.filter(x=>x.at).length,c=a.filter(x=>x.correct).length;$('dash').innerHTML=`<b>${n}/${Q.length} answered · ${c} currently correct</b><progress max="${Q.length}" value="${n}"></progress><small>Mastery proxy: ${Math.round(c/Q.length*100)}% of pilot questions correct; not full guideline coverage.</small>`}function start(m){clearInterval(timer);mode=m;i=0;ids=Q.map((q,j)=>j).filter(j=>m==='all'||m==='wrong'&&s.a[j]?.at&&!s.a[j].correct||m==='book'&&s.a[j]?.book||m==='due'&&s.a[j]?.at&&s.a[j].due<=Date.now());render()}function exam(){let n=Number(prompt('Number of questions (1–'+Q.length+')',Q.length)),min=Number(prompt('Minutes',10));if(!Number.isInteger(n)||n<1||n>Q.length||!Number.isFinite(min)||min<=0)return;mode='exam';ids=Q.map((q,j)=>j).sort(()=>Math.random()-.5).slice(0,n);i=0;answers={};end=Date.now()+min*60000;clearInterval(timer);timer=setInterval(()=>{if(Date.now()>=end)finish();else if($('clock'))$('clock').textContent=Math.ceil((end-Date.now())/1000)+' seconds left'},1000);render()}function finish(){let el=document.querySelector('input[name=opt]:checked');if(el&&mode==='exam')answers[ids[i]]=Number(el.value);clearInterval(timer);let c=0;ids.forEach(j=>{if(answers[j]===Q[j][2])c++;if(answers[j]!==undefined)record(j,answers[j])});mode='result';$('main').innerHTML=`<h2>Exam result: ${c}/${ids.length}</h2>`+ids.map(j=>`<details><summary>${Q[j][0]} — ${answers[j]===Q[j][2]?'Correct':'Incorrect / unanswered'}</summary>${feedback(j)}</details>`).join('')}function record(j,v){let old=s.a[j]||{},ok=v===Q[j][2];s.a[j]={...old,at:Date.now(),correct:ok,v,due:Date.now()+(ok?86400000*3:86400000)};save()}function feedback(j){let q=Q[j];return `<h3>Correct answer: ${q[1][q[2]]}</h3><article class="feedback-card guideline"><h3 class="feedback-heading">▤ &nbsp; Original Guideline Text</h3><div class="feedback-body"><p>${excerpts[j]}</p><small>ESC/ERS 2022 · ${q[6]} · COR/LOE: not applicable</small><p><a href="https://academic.oup.com/eurheartj/article/43/38/3618/6673929" target="_blank" rel="noopener">Read original guideline ↗</a></p></div></article><article class="feedback-card explanation"><h3 class="feedback-heading">◎ &nbsp; Explanation</h3><div class="feedback-body"><p>${q[3]}</p><hr class="explanation-divider"><p class="arabic" lang="ar">${q[4]}</p></div></article><details open class="feedback-card recall"><summary class="feedback-heading">◇ &nbsp; Memory Hook & Clinical Application</summary><div class="feedback-body"><p>${q[5]}</p></div></details>`}function render(){if(!ids.length){$('main').textContent='No questions in this view.';return}let j=ids[i],q=Q[j],a=s.a[j]||{},v=mode==='exam'?answers[j]:a.v,graded=mode!=='exam'&&a.at;$('main').innerHTML=`<div class="toprow"><small>Question ${i+1} / ${ids.length} · ${q[6]} <span id="clock"></span></small>${mode!=='exam'?`<button class="star" aria-label="Toggle bookmark" aria-pressed="${!!a.book}" onclick="toggleBook()">${a.book?'★':'☆'}</button>`:''}</div><details><summary>Question navigator</summary><div class="map">${ids.map((id,k)=>`<button class="${mode==='exam'?'':s.a[id]?.at?(s.a[id].correct?'ok':'wrong'):''} ${k===i?'current':''}" onclick="go(${k})">${k+1}${mode!=='exam'&&s.a[id]?.book?' ★':''}</button>`).join('')}</div></details><h2>${q[0]}</h2>`+q[1].map((o,k)=>`<label class="${graded?(k===q[2]?'good':v===k?'bad':''):''}"><input type="radio" name="opt" value="${k}" ${v===k?'checked':''} ${graded?'disabled':''}> ${String.fromCharCode(65+k)}. ${o} ${graded&&k===q[2]?'✓':graded&&v===k?'✗':''}</label>`).join('')+`<button class="primary" onclick="${graded?'retry()':'submitAnswer()'}">${graded?'Retry question':'Submit Answer'}</button><div class="navrow"><button class="nav" onclick="go(i-1)" ${i===0?'disabled':''}>← Previous</button><button class="nav" onclick="${i===ids.length-1&&mode==='exam'?'finish()':'go(i+1)'}" ${i===ids.length-1&&mode!=='exam'?'disabled':''}>${i===ids.length-1&&mode==='exam'?'Finish exam':'Next →'}</button></div><div id="fb">${graded?`<h3 class="${a.correct?'goodtext':'badtext'}">${a.correct?'✓ Correct':'✗ Incorrect'}</h3>`+feedback(j):''}</div>`;if(mode!=='exam'){let t=document.createElement('textarea');t.placeholder='Personal notes';t.value=a.note||'';t.oninput=()=>{s.a[j]={...s.a[j],note:t.value};save()};$('main').append(t)}}function go(k){if(k>=0&&k<ids.length){if(mode==='exam'){let el=document.querySelector('input[name=opt]:checked');if(el)answers[ids[i]]=Number(el.value)}i=k;render()}}function toggleBook(){let j=ids[i];s.a[j]={...s.a[j],book:!s.a[j]?.book};save();render()}function retry(){let j=ids[i];delete s.a[j].at;delete s.a[j].correct;delete s.a[j].v;save();render()}function submitAnswer(){let el=document.querySelector('input[name=opt]:checked');if(!el)return;let j=ids[i],v=Number(el.value);if(mode==='exam'){answers[j]=v;if(i<ids.length-1){i++;render()}else finish()}else{record(j,v);render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='cardiology-progress.json';a.click()}$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.a||typeof x.a!=='object')throw 0;s=x;save();start('all')}catch{alert('Invalid backup')}};if(s.dark)document.body.classList.add('dark');dash();start('all');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
