<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14283d"><link rel="manifest" href="manifest.json"><title>Cardiology Mastery</title><style>body{font:16px system-ui;margin:auto;max-width:800px;padding:20px;background:#f2f5f8;color:#14283d}body.dark{background:#101827;color:#e6edf5}section{background:#ffffff12;border:1px solid #8295a766;border-radius:14px;padding:18px;margin:12px 0}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #8295a7;border-radius:8px;margin:4px;background:transparent;color:inherit}button{cursor:pointer}button:hover{background:#8295a733}label{display:block;padding:12px;border:1px solid #8295a766;border-radius:8px;margin:8px 0}a{color:#398ad0}textarea{width:90%}small{opacity:.8}h1{margin-bottom:0}progress{width:100%}</style><h1>Cardiology Mastery</h1><small>ESC/ERS 2022 • Pulmonary Hypertension • Pilot v0.1</small><section id="dash"></section><button onclick="document.body.classList.toggle('dark');s.dark=document.body.classList.contains('dark');save()">Light / Dark</button><button onclick="start('all')">Study</button><button onclick="start('wrong')">Mistakes</button><button onclick="start('due')">Due review</button><button onclick="start('book')">Bookmarks</button><button onclick="exam()">Exam</button><section id="main"></section><button onclick="backup()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button><input hidden id="imp" type="file" accept="application/json"><button onclick="if(confirm('Reset all progress and notes?')){s={a:{},dark:s.dark};save();start('all')}">Reset pilot</button><script src="questions.js"></script><script>
let s={a:{},dark:false};try{s=JSON.parse(localStorage.getItem('ph-pilot'))||s}catch{};let ids=[],i=0,mode='all',end=0,timer,answers={};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('ph-pilot',JSON.stringify(s))}catch{alert('Storage unavailable; export a backup.')}dash()}function dash(){let a=Object.values(s.a),n=a.filter(x=>x.at).length,c=a.filter(x=>x.correct).length;$('dash').innerHTML=`<b>${n}/${Q.length} answered · ${c} currently correct</b><progress max="${Q.length}" value="${n}"></progress><small>Mastery proxy: ${Math.round(c/Q.length*100)}% of pilot questions correct; not full guideline coverage.</small>`}function start(m){clearInterval(timer);mode=m;i=0;ids=Q.map((q,j)=>j).filter(j=>m==='all'||m==='wrong'&&s.a[j]?.at&&!s.a[j].correct||m==='book'&&s.a[j]?.book||m==='due'&&s.a[j]?.at&&s.a[j].due<=Date.now());render()}function exam(){let n=Number(prompt('Number of questions (1–'+Q.length+')',Q.length)),min=Number(prompt('Minutes',10));if(!Number.isInteger(n)||n<1||n>Q.length||!Number.isFinite(min)||min<=0)return;mode='exam';ids=Q.map((q,j)=>j).sort(()=>Math.random()-.5).slice(0,n);i=0;answers={};end=Date.now()+min*60000;clearInterval(timer);timer=setInterval(()=>{if(Date.now()>=end)finish();else if($('clock'))$('clock').textContent=Math.ceil((end-Date.now())/1000)+' seconds left'},1000);render()}function finish(){clearInterval(timer);let c=0;ids.forEach(j=>{if(answers[j]===Q[j][2])c++;if(answers[j]!==undefined)record(j,answers[j])});mode='result';$('main').innerHTML=`<h2>Exam result: ${c}/${ids.length}</h2>`+ids.map(j=>`<details><summary>${Q[j][0]} — ${answers[j]===Q[j][2]?'Correct':'Incorrect / unanswered'}</summary>${feedback(j)}</details>`).join('')}function record(j,v){let old=s.a[j]||{},ok=v===Q[j][2];s.a[j]={...old,at:Date.now(),correct:ok,v,due:Date.now()+(ok?86400000*3:86400000)};save()}function feedback(j){let q=Q[j];return `<h3>Correct answer: ${q[1][q[2]]}</h3><p>${q[3]}</p><p dir="rtl">${q[4]}</p><details><summary>Memory hook & clinical application</summary><p>${q[5]}</p></details><p><b>Source:</b> ESC/ERS 2022, ${q[6]}. COR/LOE: not applicable to definitions/classification.</p><a href="https://academic.oup.com/eurheartj/article/43/38/3618/6673929" target="_blank">Original guideline</a>`}function render(){if(!ids.length){$('main').textContent='No questions in this view.';return}let j=ids[i],q=Q[j],a=s.a[j]||{},v=mode==='exam'?answers[j]:a.v;$('main').innerHTML=`<small>${i+1}/${ids.length} · ${q[6]} <span id="clock"></span></small><h2>${q[0]}</h2>`+q[1].map((o,k)=>`<label><input type="radio" name="opt" value="${k}" ${v===k?'checked':''}>${o}</label>`).join('')+`<button onclick="submitAnswer()">Submit</button><button onclick="if(i>0){i--;render()}">Previous</button><button onclick="if(i<ids.length-1){i++;render()}else if(mode==='exam')finish()">${i===ids.length-1&&mode==='exam'?'Finish':'Next'}</button><div id="fb">${mode!=='exam'&&a.at?feedback(j):''}</div>`;if(mode!=='exam'){let b=document.createElement('button');b.textContent=a.book?'Remove bookmark':'Bookmark';b.onclick=()=>{s.a[j]={...a,book:!a.book};save();render()};$('main').append(b);let t=document.createElement('textarea');t.placeholder='Personal notes';t.value=a.note||'';t.oninput=()=>{s.a[j]={...s.a[j],note:t.value};save()};$('main').append(t)}}function submitAnswer(){let el=document.querySelector('input[name=opt]:checked');if(!el)return;let j=ids[i],v=Number(el.value);if(mode==='exam'){answers[j]=v;if(i<ids.length-1){i++;render()}else finish()}else{record(j,v);$('fb').innerHTML=(s.a[j].correct?'✓ Correct':'✗ Incorrect')+feedback(j)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='cardiology-progress.json';a.click()}$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.a||typeof x.a!=='object')throw 0;s=x;save();start('all')}catch{alert('Invalid backup')}};if(s.dark)document.body.classList.add('dark');dash();start('all');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
