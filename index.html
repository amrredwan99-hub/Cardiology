const excerpts=["Pulmonary hypertension is defined by a mean pulmonary arterial pressure (mPAP) >20 mmHg at rest (Table 5).", "Pre-capillary PH\nmPAP >20 mmHg\nPAWP ≤15 mmHg\nPVR >2 WU", "IpcPH\nmPAP >20 mmHg\nPAWP >15 mmHg\nPVR ≤2 WU", "CpcPH\nmPAP >20 mmHg\nPAWP >15 mmHg\nPVR >2 WU", "Some patients present with elevated mPAP (>20 mmHg) but low PVR (≤2 WU) and low PAWP (≤15 mmHg); this haemodynamic condition may be described by the term ‘unclassified PH’ (see text for further details).", "Exercise PH\nmPAP/CO slope between rest and exercise >3 mmHg/L/min", "GROUP 4 PH associated with pulmonary artery obstructions\n4.1 Chronic thrombo-embolic PH", "GROUP 1 Pulmonary arterial hypertension (PAH)\n1.4.1 Connective tissue disease", "GROUP 3 PH associated with lung diseases and/or hypoxia\n3.1 Obstructive lung disease or emphysema", "GROUP 2 PH associated with left heart disease\n2.1 Heart failure:\n2.1.1 with preserved ejection fraction", "GROUP 5 PH with unclear and/or multifactorial mechanisms\n5.4 Chronic renal failure with or without haemodialysis", "GROUP 1 Pulmonary arterial hypertension (PAH)\n1.5 PAH with features of venous/capillary (PVOD/PCH) involvement", "GROUP 1 Pulmonary arterial hypertension (PAH)\n1.4.2 HIV infection", "GROUP 1 Pulmonary arterial hypertension (PAH)\n1.4.3 Portal hypertension", "GROUP 3 PH associated with lung diseases and/or hypoxia\n3.2 Restrictive lung disease", "GROUP 3 PH associated with lung diseases and/or hypoxia\n3.4 Hypoventilation syndromes", "GROUP 5 PH with unclear and/or multifactorial mechanisms\n5.6 Fibrosing mediastinitis", "Other causes of pulmonary artery obstructions include: sarcomas (high or intermediate grade or angiosarcoma), other malignant tumours (e.g. renal carcinoma, uterine carcinoma, germ-cell tumours of the testis), non-malignant tumours (e.g. uterine leiomyoma), arteritis without connective tissue disease, congenital pulmonary arterial stenoses, and hydatidosis.", "GROUP 2 PH associated with left heart disease\n2.2 Valvular heart disease", "GROUP 1 Pulmonary arterial hypertension (PAH)\n1.4.5 Schistosomiasis", "Globally, LHD is the leading cause of PH.", "Present estimates suggest a PH prevalence of ∼1% of the global population.", "In most PAH registries, IPAH was the most common subtype (50–60% of all cases), followed by PAH associated with connective tissue disease (CTD), CHD, and portal hypertension (porto-pulmonary hypertension [PoPH]).", "Definite association\nDasatinib", "Definite association\nAminorex\nMethamphetamines", "Including sarcoidosis, pulmonary Langerhans’s cell histiocytosis, and neurofibromatosis type 1.\nIncluding glycogen storage diseases and Gaucher disease.", "Pre-capillary PH\nmPAP >20 mmHg\nPAWP ≤15 mmHg\nPVR >2 WU", "GROUP 4 PH associated with pulmonary artery obstructions\n4.1 Chronic thrombo-embolic PH", "Echocardiography is recommended as the first-line, non-invasive, diagnostic investigation in suspected PH", "Considering the inaccuracies in estimating RAP and the amplification of measurement errors by using derived variables, these guidelines recommend using the peak TRV (and not the estimated sPAP) as the key variable for assigning the echocardiographic probability of PH.", "It is recommended to maintain the current threshold for TRV (>2.8 m/s) for echocardiographic probability of PH according to the updated haemodynamic definition", "Tricuspid regurgitation (TR) velocity may underestimate (e.g. in patients with severe TR) or overestimate (e.g. in patients with high CO in liver disease or sickle cell disease [SCD], misinterpretation of tricuspid valve closure artefact for the TR jet, or incorrect assignment of a peak TRV in the case of maximum velocity boundary artefacts) pressure gradients.", "RV/LV basal diameter/area ratio >1.0\nRVOT AT <105 ms and/or mid-systolic notching\nRA area (end-systole) >18 cm²", "TAPSE/sPAP ratio <0.55 mm/mmHg", "In symptomatic patients with intermediate echocardiographic probability of PH, CPET may be considered to further determine the likelihood of PH", "A ventilation/perfusion (V/Q) lung scan (planar or single-photon emission computed tomography [SPECT]) is recommended in the diagnostic work-up of patients with suspected or newly diagnosed PH, to rule out or detect signs of CTEPH.", "Initial evaluation should include a comprehensive medical (including familial) history, thorough physical examination (including measurement of blood pressure, heart rate, and pulse oximetry), blood test to determine BNP/NT-proBNP, and resting ECG.", "Patients should be referred to a PH centre for further evaluation in the following situations: (1) when an intermediate/high probability of PH is established; (2) in the presence of risk factors for PAH, or a history of PE.", "Pulmonary function tests with DLCO are recommended in the initial evaluation of patients with PH", "Open or thoracoscopic lung biopsy is not recommended in patients with PAH"];

let s={a:{},dark:false};try{s=JSON.parse(localStorage.getItem('ph-pilot'))||s}catch{};let ids=[],i=0,mode='all',end=0,timer,answers={},examStarted=0,result=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('ph-pilot',JSON.stringify(s))}catch{alert('Storage unavailable; export a backup.')}dash()}function dash(){let a=Object.values(s.a),n=a.filter(x=>x.at).length,c=a.filter(x=>x.correct).length;$('dash').innerHTML=`<b>${n}/${Q.length} answered · ${c} currently correct</b><progress max="${Q.length}" value="${n}"></progress><small>Mastery proxy: ${Math.round(c/Q.length*100)}% of pilot questions correct; not full guideline coverage.</small><p><b>Topic coverage (question counts)</b></p>${["Haemodynamics","Clinical classification","Epidemiology & risk factors","Echocardiography","Diagnostic approach"].map(t=>`<small style="display:block">${t}: ${Q.filter((q,j)=>topic(j)===t).length} questions</small>`).join("")}`}function start(m){clearInterval(timer);$('examclock').hidden=true;mode=m;i=0;ids=Q.map((q,j)=>j).filter(j=>m==='all'||m===topic(j)||m==='wrong'&&s.a[j]?.at&&!s.a[j].correct||m==='book'&&s.a[j]?.book||m==='due'&&s.a[j]?.at&&s.a[j].due<=Date.now());render()}function exam(){let n=Number(prompt('Number of questions (1–'+Q.length+')',Q.length)),min=Number(prompt('Minutes (0 = untimed)',10));if(!Number.isInteger(n)||n<1||n>Q.length||!Number.isFinite(min)||min<0)return;mode='exam';ids=Q.map((q,j)=>j).sort(()=>Math.random()-.5).slice(0,n);i=0;answers={};examStarted=Date.now();end=min===0?Infinity:examStarted+min*60000;clearInterval(timer);render();tick();timer=setInterval(tick,250)}function tick(){if(mode!=='exam')return;let timed=Number.isFinite(end),left=timed?Math.max(0,Math.ceil((end-Date.now())/1000)):Math.floor((Date.now()-examStarted)/1000);let bar=$('examclock');bar.hidden=false;bar.classList.toggle('warn',timed&&left<=300&&left>60);bar.classList.toggle('urgent',timed&&left<=60);$('clocklabel').textContent=timed?'Time remaining':'Elapsed time';$('clockvalue').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(timed&&left===0)finish()}

1} / ${selected.length}</small><button class="nav" ${k>=selected.length-1?'disabled':''} onclick="selectReview('${filter}',${selected[k+1]})">Next →</button></div><button onclick="document.getElementById('main').scrollIntoView({behavior:'smooth'})">Back to results ↑</button>`}</div>`}

function lastExam(){if(!s.lastExam){alert('No completed exam yet.');return}clearInterval(timer);$('examclock').hidden=true;result=s.lastExam;showResult()}
function record(j,v){let old=s.a[j]||{},ok=correct(j,v);s.a[j]={...old,at:Date.now(),correct:ok,v,due:Date.now()+(ok?86400000*3:86400000)};save()}async function copySource(j){try{await navigator.clipboard.writeText(excerpts[j]);alert("Copied original text")}catch{alert("Copy unavailable. Select the text manually.")}}function feedback(j){let q=Q[j];return `<h3>Correct answer: ${answerText(j,q[2])}</h3><article class="feedback-card guideline"><h3 class="feedback-heading">▤ &nbsp; Original Guideline Text</h3><div class="feedback-body"><p style="white-space:pre-line">${excerpts[j].replace(/&/g,"&amp;").replace(/</g,"&lt;")}</p><button onclick="copySource(${j})">Copy Original Text</button><small>ESC/ERS 2022 · ${q[6]} · COR/LOE: ${cor[j]||"not applicable"}</small><p><a href="https://academic.oup.com/eurheartj/article/43/38/3618/6673929" target="_blank" rel="noopener">Read original guideline ↗</a></p></div></article><article class="feedback-card explanation"><h3 class="feedback-heading">◎ &nbsp; Explanation</h3><div class="feedback-body"><p>${q[3]}</p><hr class="explanation-divider"><p class="arabic" lang="ar">${q[4]}</p></div></article><details open class="feedback-card recall"><summary class="feedback-heading">◇ &nbsp; Memory Hook & Clinical Application</summary><div class="feedback-body"><p>${q[5]}</p></div></details>`}function render(){if(!ids.length){$('main').textContent='No questions in this view.';return}let j=ids[i],q=Q[j],a=s.a[j]||{},v=mode==='exam'?answers[j]:a.v,graded=mode!=='exam'&&a.at;$('main').innerHTML=`<div class="toprow"><small>Question ${i+1} / ${ids.length} · ${q[6]} <span id="clock"></span></small>${mode!=='exam'?`<button class="star" aria-label="Toggle bookmark" aria-pressed="${!!a.book}" onclick="toggleBook()">${a.book?'★':'☆'}</button>`:''}</div><details><summary>Question navigator</summary><div class="map">${ids.map((id,k)=>`<button class="${mode==='exam'?(answers[id]!==undefined?'answered':''):s.a[id]?.at?(s.a[id].correct?'ok':'wrong'):''} ${k===i?'current':''}" onclick="go(${k})">${k+1}${mode!=='exam'&&s.a[id]?.book?' ★':''}</button>`).join('')}</div></details><h2>${q[0]}</h2>${multi(j)?'<p>Select all that apply.</p>':''}`+q[1].map((o,k)=>`<label class="${graded?(has(q[2],k)?'good':has(v,k)?'bad':''):''}"><input type="${multi(j)?'checkbox':'radio'}" name="opt" value="${k}" ${has(v,k)?'checked':''} ${graded?'disabled':''}> ${String.fromCharCode(65+k)}. ${o} ${graded&&has(q[2],k)?'✓':graded&&has(v,k)?'✗':''}</label>`).join('')+`<button class="primary" onclick="${graded?'retry()':'submitAnswer()'}">${graded?'Retry question':'Submit Answer'}</button><div class="navrow"><button class="nav" onclick="go(i-1)" ${i===0?'disabled':''}>← Previous</button><button class="nav" onclick="${i===ids.length-1&&mode==='exam'?'finish()':'go(i+1)'}" ${i===ids.length-1&&mode!=='exam'?'disabled':''}>${i===ids.length-1&&mode==='exam'?'Finish exam':'Next →'}</button></div>${mode==='exam'?'<button onclick="if(confirm(\'Finish exam and grade all questions?\'))finish()">Finish exam now</button>':''}<div id="fb">${graded?`<h3 class="${a.correct?'goodtext':'badtext'}">${a.correct?'✓ Correct':'✗ Incorrect'}</h3>`+feedback(j):''}</div>`;if(mode!=='exam'){let t=document.createElement('textarea');t.placeholder='Personal notes';t.value=a.note||'';t.oninput=()=>{s.a[j]={...s.a[j],note:t.value};save()};$('main').append(t)}}function go(k){if(k>=0&&k<ids.length){if(mode==='exam'){let v=readAnswer(ids[i]);if(v!==undefined)answers[ids[i]]=v;else delete answers[ids[i]]}i=k;render()}}function toggleBook(){let j=ids[i];s.a[j]={...s.a[j],book:!s.a[j]?.book};save();render()}function retry(){let j=ids[i];delete s.a[j].at;delete s.a[j].correct;delete s.a[j].v;save();render()}function submitAnswer(){let j=ids[i],v=readAnswer(j);if(v===undefined)return;if(mode==='exam'){answers[j]=v;if(i<ids.length-1){i++;render()}else finish()}else{record(j,v);render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='cardiology-progress.json';a.click()}$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.a||typeof x.a!=='object')throw 0;s=x;save();start('all')}catch{alert('Invalid backup')}};if(s.dark)document.body.classList.add('dark');dash();start('all');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
