5}progress{accent-color:#0d9488}.map{display:flex;flex-wrap:wrap;gap:4px}.map button{min-width:38px}.map .ok{background:#16803c;color:white}.map .wrong{background:#b91c1c;color:white}.map .current{outline:3px solid #2563eb}details{margin:12px 0}summary{cursor:pointer;font-weight:600}footer{text-align:center;padding:20px;color:#0d9488}textarea{box-sizing:border-box;width:100%}
.brand{position:relative;overflow:hidden;background:linear-gradient(120deg,#102a43,#12566a 65%,#0f766e);color:#fff;padding:26px 24px;border-radius:18px;box-shadow:0 8px 24px #102a4326;margin-bottom:18px}.brand:after{content:'';position:absolute;right:-40px;top:-70px;width:220px;height:220px;border:1px solid #ffffff24;border-radius:50%;box-shadow:0 0 0 25px #ffffff0b,0 0 0 50px #ffffff08;pointer-events:none}.brand h1{font-family:system-ui,sans-serif;font-size:clamp(25px,5vw,38px);letter-spacing:-1.1px;line-height:1.15;color:white;margin:8px 0}.brand .byline{color:#a7f3d0;font-weight:600;margin:6px 0 12px}.brand small{color:#e0f2fe;opacity:1}.brand .eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:#bae6fd}.feedback-card{border:1px solid #cbd9e5;border-radius:12px;overflow:hidden;margin:16px 0;background:#fff}.feedback-heading{margin:0;padding:12px 15px;font-size:16px;font-weight:750;display:flex;align-items:center;gap:8px;line-height:1.4}.feedback-body{padding:4px 15px 12px;line-height:1.7;overflow-wrap:anywhere}.guideline .feedback-heading{background:#e8f0ff;color:#1e40af}.explanation .feedback-heading{background:#e1f4ef;color:#115e59}.recall .feedback-heading{background:#f0eaff;color:#6332a0}.feedback-body .arabic{border-top:1px solid #cbd9e5;padding-top:12px}.language-label{display:block;font-size:11px;letter-spacing:1px;font-weight:700;color:#52677b;margin-top:12px}.feedback-card summary{list-style:none}.feedback-card summary:after{content:'+';margin-left:auto}.feedback-card[open] summary:after{content:'−'}.feedback-card summary::-webkit-details-marker{display:none}body.dark .feedback-card{background:#192538;border-color:#41536a}body.dark .guideline .feedback-heading{background:#233b63;color:#bfdbfe}body.dark .explanation .feedback-heading{background:#194842;color:#a7f3d0}body.dark .recall .feedback-heading{background:#40335c;color:#ddd6fe}body.dark .language-label{color:#b6c8da}body.dark .feedback-body .arabic{border-color:#41536a}@media(max-width:480px){body{padding:12px}.brand{padding:22px 16px}section{padding:13px}.feedback-body{padding-inline:12px}}
.explanation-divider{border:0;border-top:1px solid currentColor;opacity:.15;margin:14px 0} .examstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border:1px solid #8295a766;border-radius:12px;padding:14px;text-align:center}.stat strong{display:block;font-size:26px}.score{text-align:center;font-size:44px;font-weight:800;color:#0d9488}.reviewitem{border:1px solid #8295a766;border-radius:12px;padding:14px;margin:16px 0}.reviewitem h3{line-height:1.5}.reviewitem label{cursor:default}.neutral{color:inherit;opacity:.75}.filters{display:flex;flex-wrap:wrap;gap:4px}.filters .active{background:#2563eb;color:white}.map .skip{background:#64748b;color:white}.map .answered{background:#2563eb;color:white}.reviewitem{scroll-margin-top:12px}.examclock{position:sticky;top:0;z-index:20;background:#123e50;color:white;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px #0003;margin-bottom:12px}.examclock[hidden]{display:none}.examclock strong{font-size:24px;font-variant-numeric:tabular-nums}.examclock.warn{background:#a65309}.examclock.urgent{background:#b91c1c}.reviewmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:260px;overflow:auto;padding:5px}.reviewmap button{margin:0;min-height:44px;padding:8px}.reviewmap .current{outline:3px solid #60a5fa;outline-offset:1px}.reviewnav{position:sticky;bottom:0;background:#eef4f8;padding:8px;border-radius:10px;z-index:5}body.dark .reviewnav{background:#192538}</style><header class="brand"><div class="eyebrow">♥ &nbsp; GUIDELINE-BASED LEARNING</div><h1>Cardiology Mastery</h1><p class="byline">By Dr. Amr Redwan</p><small>ESC/ERS 2022 · Pulmonary Hypertension · v0.4.1</small></header><section id="dash"></section><button onclick="document.body.classList.toggle('dark');s.dark=document.body.classList.contains('dark');save()">Light / Dark</button><button onclick="start('all')">Study</button><button onclick="start('wrong')">Mistakes</button><button onclick="start('due')">Due review</button><button onclick="start('book')">Bookmarks</button><button onclick="exam()">Exam</button><button onclick="lastExam()">Last exam result</button><div id="examclock" class="examclock" hidden><span id="clocklabel"></span><strong id="clockvalue"></strong></div><section id="main"></section><button onclick="backup()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button><input hidden id="imp" type="file" accept="application/json"><button onclick="if(confirm('Reset all progress and notes?')){s={a:{},dark:s.dark};save();start('all')}">Reset pilot</button><footer>Cardiology Mastery · By Dr. Amr Redwan</footer><script src="questions.js"></script><script>
const excerpts=["mPAP >20 mmHg", "Pre-capillary PH: mPAP >20 mmHg; PAWP ≤15 mmHg; PVR >2 WU", "IpcPH: mPAP >20 mmHg; PAWP >15 mmHg; PVR ≤2 WU", "CpcPH: mPAP >20 mmHg; PAWP >15 mmHg; PVR >2 WU", "This haemodynamic condition may be described by the term ‘unclassified PH’.", "mPAP/CO slope >3 mmHg/L/min between rest and exercise", "4.1 Chronic thrombo-embolic PH", "1.4.1 Connective tissue disease", "3.1 Obstructive lung disease or emphysema", "2.1.1 with preserved ejection fraction", "5.4 Chronic renal failure with or without haemodialysis", "1.5 PAH with features of venous/capillary (PVOD/PCH) involvement","1.4.2 HIV infection","1.4.3 Portal hypertension","3.2 Restrictive lung disease","3.4 Hypoventilation syndromes","5.6 Fibrosing mediastinitis","congenital pulmonary arterial stenoses","2.2 Valvular heart disease","1.4.5 Schistosomiasis"];let s={a:{},dark:false};try{s=JSON.parse(localStorage.getItem('ph-pilot'))||s}catch{};let ids=[],i=0,mode='all',end=0,timer,answers={},examStarted=0,result=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('ph-pilot',JSON.stringify(s))}catch{alert('Storage unavailable; export a backup.')}dash()}function dash(){let a=Object.values(s.a),n=a.filter(x=>x.at).length,c=a.filter(x=>x.correct).length;$('dash').innerHTML=`<b>${n}/${Q.length} answered · ${c} currently correct</b><progress max="${Q.length}" value="${n}"></progress><small>Mastery proxy: ${Math.round(c/Q.length*100)}% of pilot questions correct; not full guideline coverage.</small>`}function start(m){clearInterval(timer);$('examclock').hidden=true;mode=m;i=0;ids=Q.map((q,j)=>j).filter(j=>m==='all'||m==='wrong'&&s.a[j]?.at&&!s.a[j].correct||m==='book'&&s.a[j]?.book||m==='due'&&s.a[j]?.at&&s.a[j].due<=Date.now());render()}function exam(){let n=Number(prompt('Number of questions (1–'+Q.length+')',Q.length)),min=Number(prompt('Minutes (0 = untimed)',10));if(!Number.isInteger(n)||n<1||n>Q.length||!Number.isFinite(min)||min<0)return;mode='exam';ids=Q.map((q,j)=>j).sort(()=>Math.random()-.5).slice(0,n);i=0;answers={};examStarted=Date.now();end=min===0?Infinity:examStarted+min*60000;clearInterval(timer);render();tick();timer=setInterval(tick,250)}function tick(){if(mode!=='exam')return;let timed=Number.isFinite(end),left=timed?Math.max(0,Math.ceil((end-Date.now())/1000)):Math.floor((Date.now()-examStarted)/1000);let bar=$('examclock');bar.hidden=false;bar.classList.toggle('warn',timed&&left<=300&&left>60);bar.classList.toggle('urgent',timed&&left<=60);$('clocklabel').textContent=timed?'Time remaining':'Elapsed time';$('clockvalue').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(timed&&left===0)finish()}
function finish(){if(mode!=='exam')return;let el=document.querySelector('input[name=opt]:checked');if(el)answers[ids[i]]=Number(el.value);clearInterval(timer);$('examclock').hidden=true;let elapsed=Math.floor((Math.min(Date.now(),end)-examStarted)/1000);result={ids:[...ids],answers:{...answers},elapsed};mode='result';for(const j of ids){if(answers[j]!==undefined)record(j,answers[j])}s.lastExam=result;save();showResult()}
function status(j){return result.answers[j]===undefined?'skip':result.answers[j]===Q[j][2]?'ok':'wrong'}
function showResult(filter='all',jump=-1){if(!result)return;mode='result';let total=result.ids.length,c=result.ids.filter(j=>status(j)==='ok').length,w=result.ids.filter(j=>status(j)==='wrong').length,u=total-c-w,t=result.elapsed;let selected=result.ids.filter(j=>filter==='all'||status(j)===filter);let j=selected.includes(jump)?jump:selected[0],k=selected.indexOf(j);$('main').innerHTML=`<small>EXAM COMPLETED</small><h2>Exam Results</h2><div class="score">${Math.round(c/total*100)}%</div><p style="text-align:center">${c} / ${total} points</p><progress max="${total}" value="${c}"></progress><div class="examstats"><div class="stat goodtext"><strong>${c}</strong>Correct</div><div class="stat badtext"><strong>${w}</strong>Incorrect</div><div class="stat"><strong>${u}</strong>Unanswered</div><div class="stat"><strong>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</strong>Time taken</div></div><button class="primary" onclick="retryExam()" ${w+u===0?'disabled':''}>Retry incorrect & unanswered</button><h2>Review answers</h2><div class="filters">${[['all','All'],['ok','Correct'],['wrong','Incorrect'],['skip','Unanswered']].map(([f,n])=>`<button class="${filter===f?'active':''}" onclick="showResult('${f}')">${n} (${f==='all'?total:f==='ok'?c:f==='wrong'?w:u})</button>`).join('')}</div><details open id="reviewmap"><summary>Question navigator (${selected.length})</summary><div class="map reviewmap">${selected.map(id=>`<button class="${status(id)} ${id===j?'current':''}" aria-label="Question ${result.ids.indexOf(id)+1}, ${status(id)}" aria-pressed="${id===j}" onclick="selectReview('${filter}',${id})">${result.ids.indexOf(id)+1}</button>`).join('')}</div><small>Green: correct · Red: incorrect · Grey: unanswered</small></details><div id="reviewpanel">${j===undefined?'<p>No questions in this category.</p>':reviewQuestion(j)+`<div class="navrow reviewnav"><button class="nav" ${k<=0?'disabled':''} onclick="selectReview('${filter}',${selected[k-1]})">← Previous</button><small>${k+1} / ${selected.length}</small><button class="nav" ${k>=selected.length-1?'disabled':''} onclick="selectReview('${filter}',${selected[k+1]})">Next →</button></div><button onclick="document.getElementById('main').scrollIntoView({behavior:'smooth'})">Back to results ↑</button>`}</div>`}
function selectReview(filter,j){let open=$('reviewmap')?.open;showResult(filter,j);if($('reviewmap'))$('reviewmap').open=open;$('reviewpanel')?.scrollIntoView({behavior:'smooth',block:'start'})}
function reviewQuestion(j){let q=Q[j],v=result.answers[j],st=status(j);return `<article class="reviewitem" id="review-${j}"><div class="toprow"><small>Question ${result.ids.indexOf(j)+1} · ${q[6]}</small><b class="${st==='ok'?'goodtext':st==='wrong'?'badtext':'neutral'}">${st==='ok'?'✓ Correct':st==='wrong'?'✗ Incorrect':'Unanswered'}</b></div><h3>${q[0]}</h3>${q[1].map((o,k)=>`<label class="${k===q[2]?'good':k===v?'bad':''}">${String.fromCharCode(65+k)}. ${o} ${k===q[2]?'✓ Correct answer':''} ${k===v?' · Your answer':''}</label>`).join('')}<p><b>Your answer:</b> ${v===undefined?'Not answered':q[1][v]}</p>${feedback(j)}</article>`}
function retryExam(){if(!result)return;let next=result.ids.filter(j=>status(j)!=='ok');if(!next.length)return;let min=Number(prompt('Minutes (0 = untimed)',Math.max(1,next.length)));if(!Number.isFinite(min)||min<0)return;ids=next;i=0;answers={};mode='exam';examStarted=Date.now();end=min===0?Infinity:examStarted+min*60000;clearInterval(timer);render();tick();timer=setInterval(tick,250)}
function lastExam(){if(!s.lastExam){alert('No completed exam yet.');return}clearInterval(timer);$('examclock').hidden=true;result=s.lastExam;showResult()}
function record(j,v){let old=s.a[j]||{},ok=v===Q[j][2];s.a[j]={...old,at:Date.now(),correct:ok,v,due:Date.now()+(ok?86400000*3:86400000)};save()}function feedback(j){let q=Q[j];return `<h3>Correct answer: ${q[1][q[2]]}</h3><article class="feedback-card guideline"><h3 class="feedback-heading">▤ &nbsp; Original Guideline Text</h3><div class="feedback-body"><p>${excerpts[j]}</p><small>ESC/ERS 2022 · ${q[6]} · COR/LOE: not applicable</small><p><a href="https://academic.oup.com/eurheartj/article/43/38/3618/6673929" target="_blank" rel="noopener">Read original guideline ↗</a></p></div></article><article class="feedback-card explanation"><h3 class="feedback-heading">◎ &nbsp; Explanation</h3><div class="feedback-body"><p>${q[3]}</p><hr class="explanation-divider"><p class="arabic" lang="ar">${q[4]}</p></div></article><details open class="feedback-card recall"><summary class="feedback-heading">◇ &nbsp; Memory Hook & Clinical Application</summary><div class="feedback-body"><p>${q[5]}</p></div></details>`}function render(){if(!ids.length){$('main').textContent='No questions in this view.';return}let j=ids[i],q=Q[j],a=s.a[j]||{},v=mode==='exam'?answers[j]:a.v,graded=mode!=='exam'&&a.at;$('main').innerHTML=`<div class="toprow"><small>Question ${i+1} / ${ids.length} · ${q[6]} <span id="clock"></span></small>${mode!=='exam'?`<button class="star" aria-label="Toggle bookmark" aria-pressed="${!!a.book}" onclick="toggleBook()">${a.book?'★':'☆'}</button>`:''}</div><details><summary>Question navigator</summary><div class="map">${ids.map((id,k)=>`<button class="${mode==='exam'?(answers[id]!==undefined?'answered':''):s.a[id]?.at?(s.a[id].correct?'ok':'wrong'):''} ${k===i?'current':''}" onclick="go(${k})">${k+1}${mode!=='exam'&&s.a[id]?.book?' ★':''}</button>`).join('')}</div></details><h2>${q[0]}</h2>`+q[1].map((o,k)=>`<label class="${graded?(k===q[2]?'good':v===k?'bad':''):''}"><input type="radio" name="opt" value="${k}" ${v===k?'checked':''} ${graded?'disabled':''}> ${String.fromCharCode(65+k)}. ${o} ${graded&&k===q[2]?'✓':graded&&v===k?'✗':''}</label>`).join('')+`<button class="primary" onclick="${graded?'retry()':'submitAnswer()'}">${graded?'Retry question':'Submit Answer'}</button><div class="navrow"><button class="nav" onclick="go(i-1)" ${i===0?'disabled':''}>← Previous</button><button class="nav" onclick="${i===ids.length-1&&mode==='exam'?'finish()':'go(i+1)'}" ${i===ids.length-1&&mode!=='exam'?'disabled':''}>${i===ids.length-1&&mode==='exam'?'Finish exam':'Next →'}</button></div>${mode==='exam'?'<button onclick="if(confirm(\'Finish exam and grade all questions?\'))finish()">Finish exam now</button>':''}<div id="fb">${graded?`<h3 class="${a.correct?'goodtext':'badtext'}">${a.correct?'✓ Correct':'✗ Incorrect'}</h3>`+feedback(j):''}</div>`;if(mode!=='exam'){let t=document.createElement('textarea');t.placeholder='Personal notes';t.value=a.note||'';t.oninput=()=>{s.a[j]={...s.a[j],note:t.value};save()};$('main').append(t)}}function go(k){if(k>=0&&k<ids.length){if(mode==='exam'){let el=document.querySelector('input[name=opt]:checked');if(el)answers[ids[i]]=Number(el.value)}i=k;render()}}function toggleBook(){let j=ids[i];s.a[j]={...s.a[j],book:!s.a[j]?.book};save();render()}function retry(){let j=ids[i];delete s.a[j].at;delete s.a[j].correct;delete s.a[j].v;save();render()}function submitAnswer(){let el=document.querySelector('input[name=opt]:checked');if(!el)return;let j=ids[i],v=Number(el.value);if(mode==='exam'){answers[j]=v;if(i<ids.length-1){i++;render()}else finish()}else{record(j,v);render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='cardiology-progress.json';a.click()}$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.a||typeof x.a!=='object')throw 0;s=x;save();start('all')}catch{alert('Invalid backup')}};if(s.dark)document.body.classList.add('dark');dash();start('all');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
